# Accepted Trivy findings. Each has a written reason; everything else at HIGH or CRITICAL fails the pipeline.
misconfigurations:
  - id: AVD-AWS-0053
    paths:
      - modules/alb/main.tf
    statement: >-
      The ALB is internet-facing by design (it is the platform's front door: HTTPS, with port 80 redirecting) but its security group admits only allowed_cidrs.
  - id: AVD-AWS-0040
    statement: >-
      The EKS API endpoint is public and open to every address (api_allowed_cidrs). Every request is authenticated by IAM and authorised by
      the cluster's access entries; the nodes use the private endpoint. It is open on purpose: a GitHub runner has a new address on every run
      and a laptop's changes too, and a plan that contained either could not be applied as approved. Raised inside the community EKS module.
  - id: AVD-AWS-0104
    statement: >-
      Egress to any address from the nodes' security group (EKS module default): nodes pull images and reach AWS APIs through the NAT
      gateways. Raised inside the community EKS module.
