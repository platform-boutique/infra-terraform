# Accepted Trivy findings. Each has a written reason; everything else at HIGH or CRITICAL fails the pipeline.
misconfigurations:
  - id: AVD-AWS-0054
    paths:
      - modules/alb/main.tf
    statement: >-
      The ALB listens on HTTP: there is no domain yet, so no ACM certificate and no HTTPS listener. It admits only allowed_cidrs
      (the maintainer's address). Add an HTTPS listener and a redirect together with the domain.
  - id: AVD-AWS-0053
    paths:
      - modules/alb/main.tf
    statement: >-
      The ALB is internet-facing by design (it is the platform's front door) but its security group admits only allowed_cidrs.
  - id: AVD-AWS-0040
    statement: >-
      The EKS API endpoint is public so that Terraform (a laptop or a GitHub runner) can reach it; it is restricted to public_access_cidrs,
      IAM-authenticated, and the private endpoint is on for the nodes. Raised inside the community EKS module.
  - id: AVD-AWS-0104
    statement: >-
      Egress to any address from the nodes' security group (EKS module default): nodes pull images and reach AWS APIs through the NAT
      gateways. Raised inside the community EKS module.
