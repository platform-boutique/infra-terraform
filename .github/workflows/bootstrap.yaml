name: Bootstrap

# Creates the S3 bucket that holds the remote state, once. The bucket cannot hold its own state, so this stack runs with a local state
# file on the runner; it is copied into the bucket afterwards and fetched again by the next run (a plain S3 object under
# bootstrap/terraform.tfstate), so running it twice changes nothing. Run it before the first Deploy.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1
      EXPECTED_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Which account, which bucket
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          bucket="platform-demo-tfstate-${account}-${AWS_REGION}"
          echo "BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "Account $account, state bucket $bucket"
          if [ "$bucket" != "$EXPECTED_BUCKET" ]; then
            echo "::error::The repository variable TF_STATE_BUCKET is '$EXPECTED_BUCKET' but this account's bucket is '$bucket'. Fix the variable."
            exit 1
          fi
      - name: Apply the bootstrap stack
        working-directory: bootstrap
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 cp "s3://$BUCKET/bootstrap/terraform.tfstate" terraform.tfstate || echo "No bootstrap state in the bucket yet."
          fi
          terraform init -input=false -lockfile=readonly
          terraform apply -input=false -auto-approve
          aws s3 cp terraform.tfstate "s3://$BUCKET/bootstrap/terraform.tfstate"
          echo "State bucket $BUCKET is ready." >> "$GITHUB_STEP_SUMMARY"
