name: Foundation

# Creates what outlives the platform: the TLS certificate for the domain (free, validated through DNS in the domain's hosted zone).
# Run it once after bootstrap, before the first Deploy. Destroy never touches it. One run: a Plan job shows what would be created, then the
# Review and Apply jobs apply that plan after the approval of the reviewer of the "production" environment.
run-name: "Foundation: ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you applying the foundation? (shown with the plan, where it is approved)
        type: string
        required: true

permissions: {}

concurrency:
  group: terraform-foundation
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
      id-token: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/terraform-plan.yaml@6a49ba88524957cd78604d05bc98accb7cd46975 # v3.0.2
    with:
      working_directory: stacks/foundation
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      role_to_assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
      reason: ${{ inputs.reason }}

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/terraform-apply.yaml@6a49ba88524957cd78604d05bc98accb7cd46975 # v3.0.2
    with:
      working_directory: stacks/foundation
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      plan_role_to_assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
      role_to_assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
      plan_id: ${{ needs.plan.outputs.plan_id }}
      environment: production
