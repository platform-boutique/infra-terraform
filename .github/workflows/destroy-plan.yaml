name: Destroy plan

# Step 1 of 2. Plans the destruction of the platform (stacks/platform); changes nothing. The bucket, the roles and the certificate
# (bootstrap, foundation) are other stacks and are never touched. Needs the confirmation typed exactly.
run-name: "Destroy plan: ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you destroying it? (shown with the plan, where it is approved)
        type: string
        required: true
      confirm:
        description: 'Type exactly: destroy platform-demo'
        type: string
        required: true

permissions: {}

concurrency:
  group: terraform-platform
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GOT: ${{ inputs.confirm }}
    steps:
      - name: Typed confirmation matches
        run: |
          if [ "$GOT" != "destroy platform-demo" ]; then
            echo "::error::Nothing was planned: the confirmation does not match. Type exactly: destroy platform-demo"
            exit 1
          fi

  plan:
    needs: confirm
    permissions:
      contents: read
      id-token: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/terraform-plan.yaml@470ad03eea7fa2594e014d450d544a28420ddef6 # feat/terraform-plan-apply, becomes v3.0.0
    with:
      working_directory: stacks/platform
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      role_to_assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
      tf_vars: '{"alb_allowed_cidrs":${{ vars.ALB_ALLOWED_CIDRS }}}'
      reason: ${{ inputs.reason }}
      destroy: true
