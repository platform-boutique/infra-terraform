name: CI

# Pull-request gate. Nothing runs on a plain push. The Terraform jobs come from the shared pipeline
# (platform-demo-workflows): fmt/validate, TFLint, Trivy, Checkov, an Infracost estimate and a plan as a pull request comment.
# They change nothing in AWS (the plan uses the read-only role). Accepted risks are in .trivyignore.yaml and .checkov.yaml / inline
# #checkov:skip, each with a reason.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  terraform:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/terraform-ci.yaml@470ad03eea7fa2594e014d450d544a28420ddef6 # feat/terraform-plan-apply, becomes v3.0.0
    with:
      directories: stacks/platform stacks/foundation stacks/bootstrap
      plan_directory: stacks/platform
      cost_directory: stacks/platform
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      role_to_assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
      tf_vars: '{"alb_allowed_cidrs":${{ vars.ALB_ALLOWED_CIDRS }}}'
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
