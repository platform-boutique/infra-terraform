name: CI

# Pull-request gate. Nothing runs on a plain push. The Terraform jobs come from the shared pipeline
# (platform-demo-workflows): fmt/validate, TFLint, Trivy, Checkov, an Infracost estimate and a plan as a pull request comment.
# They change nothing in AWS. Accepted risks are in .trivyignore.yaml and .checkov.yaml / inline #checkov:skip, each with a reason.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  terraform:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/terraform-ci.yaml@92fc15988807025a9261209e37d3546ad8e9d757 # v2.1.0
    with:
      directories: envs/platform envs/foundation bootstrap
      plan_directory: envs/platform
      cost_directory: envs/platform
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      tf_vars: '{"domain_name":"${{ vars.DOMAIN_NAME }}","api_allowed_cidrs":${{ vars.API_ALLOWED_CIDRS }},"alb_allowed_cidrs":${{ vars.ALB_ALLOWED_CIDRS }}}'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
