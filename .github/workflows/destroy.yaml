name: Destroy

# Tears the platform down (for cost). Started by hand with a reason and the confirmation typed exactly. A Plan job lists everything that
# would be destroyed; then the Destroy job waits for YOUR approval on the "destruction" environment, empties the cluster (Argo CD apps,
# PVCs, LoadBalancer Services), destroys exactly the approved resources and lists what is left in the account. The state bucket
# (bootstrap/) is never touched.
run-name: "Destroy: ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you destroying it? (shown with the plan where you approve it)
        type: string
        required: true
      confirm:
        description: 'Type exactly: destroy platform-demo'
        type: string
        required: true
      delete_leftover_volumes:
        description: Also delete unattached EBS volumes the EBS CSI driver created (tag ebs.csi.aws.com/cluster=true)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: terraform-platform
  cancel-in-progress: false

jobs:
  destroy:
    permissions:
      contents: read
      id-token: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/terraform-destroy.yaml@92fc15988807025a9261209e37d3546ad8e9d757 # v2.1.0
    with:
      confirmation: ${{ inputs.confirm }}
      expected_confirmation: destroy platform-demo
      working_directory: envs/platform
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      tf_vars: '{"api_allowed_cidrs":${{ vars.API_ALLOWED_CIDRS }},"alb_allowed_cidrs":${{ vars.ALB_ALLOWED_CIDRS }}}'
      runner_ip_variable: api_allowed_cidrs
      cluster_name: platform-demo
      delete_leftover_volumes: ${{ inputs.delete_leftover_volumes }}
      reason: ${{ inputs.reason }}
      environment: destruction
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
