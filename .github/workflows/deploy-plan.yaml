name: Deploy plan

# Step 1 of 2. Plans the platform and saves the plan; changes nothing. The run page shows your reason and what would change, and a plan id.
# Step 2 is "Deploy apply" with that plan id, where a reviewer approves before anything is created.
run-name: "Deploy plan: ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you deploying? (shown with the plan, where it is approved)
        type: string
        required: true

permissions: {}

concurrency:
  group: terraform-platform
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
      id-token: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/terraform-plan.yaml@470ad03eea7fa2594e014d450d544a28420ddef6 # feat/terraform-plan-apply, becomes v3.0.0
    with:
      working_directory: stacks/platform
      state_bucket: ${{ vars.TF_STATE_BUCKET }}
      role_to_assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
      tf_vars: '{"alb_allowed_cidrs":${{ vars.ALB_ALLOWED_CIDRS }}}'
      reason: ${{ inputs.reason }}
