version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  # Providers (the lock files) and registry modules. A new major version is a deliberate upgrade, never an automatic PR.
  - package-ecosystem: terraform
    directories:
      - /stacks/*
      - /modules/*
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
