# Same objects as gitops/bootstrap/root.yaml of the Helm repository (kept in step by hand; the repository, revision and path are values
# here). Everything else is created from Git: the root Application syncs `path`, which contains the projects, the ApplicationSets and
# Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-admin
  namespace: {{ .Values.namespace }}
spec:
  description: "Argo CD itself and the GitOps definitions (projects, ApplicationSets). Cluster-admin by design, keep it small."
  sourceRepos:
    - {{ required "repoURL is required" .Values.repoURL }}
    - {{ required "argoHelmRepoURL is required" .Values.argoHelmRepoURL }}
  destinations:
    - { name: in-cluster, namespace: {{ .Values.namespace }} }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: {{ .Values.namespace }}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform-admin
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ required "revision is required" .Values.revision }}
    path: {{ required "path is required" .Values.path }}
  destination: { name: in-cluster, namespace: {{ .Values.namespace }} }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
